version: '3.8'

services:
  guanxin_sim:
    image: guanxin_sim:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guanxin_sim_container
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - GZ_SIM_RESOURCE_PATH=/ros2_ws/src/guanxin_sim/models:/ros2_ws/install/guanxin_sim/share/guanxin_sim/models
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./src:/ros2_ws/src
    command: ros2 launch guanxin_sim sim.launch.py
    stdin_open: true
    tty: true
